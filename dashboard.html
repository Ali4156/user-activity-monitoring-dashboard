<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Activity Monitoring Dashboard</title>
    <style>
        /* CSS Styling */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.2);
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e293b, var(--bg-color));
        }

        .dashboard-container {
            width: 90%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            background: var(--success-glow);
            color: var(--success);
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .card:hover {
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .active-app-display {
            font-size: 1.75rem;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            word-break: break-word;
            line-height: 1.3;
        }

        .app-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 8px 16px -4px var(--primary-glow);
        }

        .history-container {
            max-height: 350px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* Custom Scrollbar */
        .history-container::-webkit-scrollbar {
            width: 6px;
        }
        .history-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }
        .history-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .history-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .app-name {
            font-weight: 500;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75%;
        }

        .app-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-style: italic;
        }
        
        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- HTML Structure -->
    <div class="dashboard-container">
        <header>
            <h1>System Activity Monitor</h1>
            <div class="status-badge" id="status-indicator">
                <div class="pulse-dot" id="pulse"></div>
                <span id="status-text">Live Tracking</span>
            </div>
        </header>

        <div class="card">
            <div class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                Currently Active Application
            </div>
            <div class="active-app-display">
                <div class="app-icon" id="main-icon">💻</div>
                <div id="current-app">Waiting for system data...</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 0;">
            <div class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Recent Activity Log
            </div>
            <div class="history-container">
                <ul class="history-list" id="history-list">
                    <!-- History items will be dynamically inserted here via JS -->
                    <li class="empty-state">No activity recorded yet...</li>
                </ul>
            </div>
        </div>
        
        <div class="footer-note">
            Operating System Project &bull; Real-time Activity Monitoring
        </div>
    </div>

    <!-- JavaScript Functionality -->
    <script>
        // API endpoint to fetch data from Python backend
        const API_URL = 'http://127.0.0.1:5000/api/activity';
        
        // DOM Elements
        const currentAppEl = document.getElementById('current-app');
        const mainIconEl = document.getElementById('main-icon');
        const historyListEl = document.getElementById('history-list');
        const statusTextEl = document.getElementById('status-text');
        const statusIndicator = document.getElementById('status-indicator');
        const pulseEl = document.getElementById('pulse');

        // Helper function to assign emojis based on application name
        function determineAppIcon(appName) {
            appName = appName.toLowerCase();
            
            // Web Browsers
            if (appName.includes('chrome') || appName.includes('edge') || appName.includes('firefox') || appName.includes('brave') || appName.includes('browser')) {
                return '🌐';
            } 
            // Development Tools
            else if (appName.includes('code') || appName.includes('studio') || appName.includes('pycharm') || appName.includes('idea')) {
                return '👨‍💻';
            } 
            // Communication
            else if (appName.includes('discord') || appName.includes('slack') || appName.includes('teams') || appName.includes('telegram')) {
                return '💬';
            } 
            // Media
            else if (appName.includes('spotify') || appName.includes('music') || appName.includes('vlc')) {
                return '🎵';
            }
            // Folders/Explorer
            else if (appName.includes('explorer') || appName.includes('folder') || appName.includes('directory')) {
                return '📁';
            }
            // Terminal
            else if (appName.includes('cmd') || appName.includes('powershell') || appName.includes('terminal')) {
                return '>_';
            }
            // Default
            return '🖥️';
        }

        // Function to update the UI with connection error state
        function setDisconnectedState() {
            statusTextEl.textContent = 'Disconnected';
            statusIndicator.style.color = '#ef4444'; // Red
            statusIndicator.style.background = 'rgba(239, 68, 68, 0.1)';
            statusIndicator.style.borderColor = 'rgba(239, 68, 68, 0.3)';
            pulseEl.style.backgroundColor = '#ef4444';
            pulseEl.style.animation = 'none'; // Stop pulsing
        }

        // Function to update the UI with active connection state
        function setConnectedState() {
            statusTextEl.textContent = 'Live Tracking';
            statusIndicator.style.color = '#10b981'; // Green
            statusIndicator.style.background = 'rgba(16, 185, 129, 0.2)';
            statusIndicator.style.borderColor = 'rgba(16, 185, 129, 0.3)';
            pulseEl.style.backgroundColor = '#10b981';
            pulseEl.style.animation = 'pulse-animation 2s infinite'; // Start pulsing
        }

        // Main function to fetch activity data from backend
        async function fetchActivityData() {
            try {
                // Make HTTP GET request to backend
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // Parse JSON response
                const data = await response.json();
                
                // Update connection status
                if (data.status === 'active') {
                    setConnectedState();
                }

                // 1. Update Currently Active Application
                const activeAppName = data.active_app || 'Unknown';
                currentAppEl.textContent = activeAppName;
                mainIconEl.textContent = determineAppIcon(activeAppName);

                // 2. Update Recent Activity Log
                if (data.recent_apps && data.recent_apps.length > 0) {
                    // Clear current list
                    historyListEl.innerHTML = '';
                    
                    // Populate with new data
                    data.recent_apps.forEach(app => {
                        const li = document.createElement('li');
                        li.className = 'history-item';
                        
                        const icon = determineAppIcon(app.name);
                        
                        li.innerHTML = `
                            <div class="app-name" title="${app.name}">
                                <span>${icon}</span>
                                ${app.name}
                            </div>
                            <div class="app-time">${app.time}</div>
                        `;
                        historyListEl.appendChild(li);
                    });
                } else if (historyListEl.children.length === 0 || historyListEl.querySelector('.empty-state')) {
                    historyListEl.innerHTML = '<li class="empty-state">No activity recorded yet...</li>';
                }

            } catch (error) {
                console.error('Failed to fetch activity data:', error);
                setDisconnectedState();
            }
        }

        // Initialize monitoring
        console.log("Starting User Activity Monitoring System...");
        
        // Fetch immediately on load
        fetchActivityData();
        
        // Setup continuous polling every 1 second (1000 ms)
        setInterval(fetchActivityData, 1000);
        
    </script>
</body>
</html>
